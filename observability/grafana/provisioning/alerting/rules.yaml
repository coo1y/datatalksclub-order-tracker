apiVersion: 1

groups:
  - orgId: 1
    name: order-tracker-alerts
    folder: Order Tracker Alerts
    interval: 1m
    rules:
      - uid: order-tracker-5xx
        title: Order Tracker 5xx errors
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: sum by (http_route) (increase(http_server_requests_total{http_status_code=~"5.."}[5m]))
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: ["A"]
                  reducer:
                    type: last
                    params: []
        annotations:
          summary: "5xx errors on {{ $labels.http_route }}"
          description: >-
            {{ $labels.http_route }} returned {{ $values.A.Value }} server error(s) (5xx)
            over the last 5 minutes. Dashboard: http://localhost:3000/d/order-tracker/order-tracker
          __dashboardUid__: order-tracker
          __panelId__: "2"
        labels:
          severity: critical
